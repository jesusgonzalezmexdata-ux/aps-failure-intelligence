name: Bug report
description: Something in the code, tests, CI or documentation does not work as described.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and the full error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: v1.3.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, install method (pip / Docker)
    validations:
      required: true
