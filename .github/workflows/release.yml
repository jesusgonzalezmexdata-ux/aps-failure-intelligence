name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Notes and the asset list come from the default branch, so older tags get them too;
      # the evidence files themselves are taken from the tagged commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          open("notes.md", "w", encoding="utf-8").write((m.group(1).strip() if m else "See CHANGELOG.md.") + "\n")
          PY
      - name: Evidence bundle from the tagged commit
        run: |
          keep=()
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            git cat-file -e "$TAG:$p" 2>/dev/null && keep+=("$p")
          done < deploy/release-assets.txt
          git cat-file -e "$TAG:LICENSE" 2>/dev/null && keep+=("LICENSE")
          git archive --format=zip -o "evidence-${TAG}.zip" "$TAG" -- "${keep[@]}"
          unzip -l "evidence-${TAG}.zip" | tail -1
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "evidence-${TAG}.zip" --clobber
          else
            gh release create "$TAG" "evidence-${TAG}.zip" --title "$TAG" --notes-file notes.md --verify-tag
          fi
